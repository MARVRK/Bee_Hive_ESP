; ================================================================
; BEE HIVE V2 — PlatformIO Configuration
; ================================================================
;
; КАК СОБИРАТЬ И ПРОШИВАТЬ:
;
;   WiFi прошивка:
;     pio run -e wifi              — только сборка
;     pio run -e wifi -t upload    — сборка + прошивка
;
;   GSM прошивка:
;     pio run -e gsm               — только сборка
;     pio run -e gsm -t upload     — сборка + прошивка
;
;   Тест периферии:
;     pio run -e test -t upload    — прошить тест всех модулей
;
;   Монитор Serial (любая прошивка):
;     pio device monitor
;
;   Выбрать порт вручную:
;     pio run -e wifi -t upload --upload-port /dev/cu.usbserial-XXXX
;
; ================================================================

[platformio]
default_envs = wifi

; ── ОБЩИЕ НАСТРОЙКИ ─────────────────────────────────────────────
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ── WIFI ПРОШИВКА ───────────────────────────────────────────────
[env:wifi]
build_src_filter =
    +<../firmware/common/*>
    +<../firmware/wifi/*>
    -<../firmware/gsm/*>
    -<../test/*>

lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    bogde/HX711@^0.7.5
    bblanchon/ArduinoJson@^7.2.1
    adafruit/RTClib@^2.1.1
    ESP Async WebServer@^1.2.3

build_flags =
    -DVERSION_WIFI
    -DCORE_DEBUG_LEVEL=3

; ── GSM ПРОШИВКА ────────────────────────────────────────────────
[env:gsm]
build_src_filter =
    +<../firmware/common/*>
    +<../firmware/gsm/*>
    -<../firmware/wifi/*>
    -<../test/*>

lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    bogde/HX711@^0.7.5
    vshymanskyy/TinyGSM@^0.12.0
    bblanchon/ArduinoJson@^7.2.1
    adafruit/RTClib@^2.1.1

build_flags =
    -DVERSION_GSM
    -DCORE_DEBUG_LEVEL=3

; ── ТЕСТ ПЕРИФЕРИИ ──────────────────────────────────────────────
[env:test]
build_src_filter =
    +<../test/*>
    +<../firmware/common/config.h>

lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    bogde/HX711@^0.7.5
    adafruit/RTClib@^2.1.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
